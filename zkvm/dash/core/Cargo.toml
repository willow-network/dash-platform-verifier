[package]
name = "dash-lane-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
sha2 = "0.10"
tiny-keccak = { version = "2.0", features = ["keccak"] }
bls12_381 = { version = "0.8.0", default-features = false, features = ["groups", "pairings", "alloc", "experimental"] }
k256 = { version = "0.13.4", default-features = false, features = ["arithmetic"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
alloy-sol-types = { version = "1", default-features = false }
alloy-primitives = { version = "1", default-features = false }
# Dash Platform's own proof verifiers, at the release mainnet runs (v4.1.1, GroveDB v5.0.1).
drive = { git = "https://github.com/dashpay/platform", tag = "v4.1.1", default-features = false, features = ["verify"] }
dpp = { git = "https://github.com/dashpay/platform", tag = "v4.1.1", default-features = false, features = ["dpns-contract"] }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
hex = "0.4"
bincode = "1.3"

[features]
cycles = []
