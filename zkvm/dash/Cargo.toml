[workspace]
resolver = "2"
members = ["core", "program", "execrun"]
# `prove/` (GPU host, sp1-sdk `cuda`) is its own workspace, so the guest's dependency
# graph never sees host crates.
exclude = ["prove"]

[profile.release]
opt-level = 3
# No LTO: the SP1 6.8.1 toolchain cannot link LTO guests (zkvm/logset-guest/Cargo.toml).
lto = false

# Hashing and signature checks run on SP1 precompiles inside the guest: SHA-256 (Core
# block/tx/commitment hashes, the ChainLock and Tenderdash sign hashes, BLS hash-to-field),
# BLS12-381 (both pairing checks), secp256k1 (identity key decompression) and keccak (ETH
# addresses). The patched crates are `cfg(target_os = "zkvm")`-gated, so native tests run the
# ordinary code. GroveDB's BLAKE3 and X11 run as software.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.2.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.2.0" }
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.2.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.2.0" }
